<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>危险网站警告</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .warning-container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
      text-align: center;
    }
    
    .warning-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    .warning-title {
      font-size: 28px;
      font-weight: 600;
      color: #F44336;
      margin-bottom: 20px;
    }
    
    .warning-content {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 8px;
      padding: 24px;
      margin: 24px 0;
      text-align: left;
    }
    
    .warning-content h3 {
      font-size: 18px;
      color: #856404;
      margin-bottom: 12px;
    }
    
    .warning-content p {
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    
    .url-display {
      font-family: monospace;
      background: #f5f5f5;
      padding: 12px;
      border-radius: 4px;
      margin: 16px 0;
      word-break: break-all;
      color: #333;
    }
    
    .threat-type {
      background: #ffebee;
      padding: 8px 16px;
      border-radius: 4px;
      display: inline-block;
      margin: 12px 0;
      color: #c62828;
      font-weight: 500;
    }
    
    .recommendations {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
      border-radius: 4px;
    }
    
    .recommendations h4 {
      color: #1976D2;
      margin-bottom: 12px;
      font-size: 16px;
    }
    
    .recommendations ul {
      list-style: none;
      padding-left: 0;
    }
    
    .recommendations li {
      padding: 8px 0;
      color: #333;
      font-size: 14px;
    }
    
    .recommendations li:before {
      content: "• ";
      color: #2196F3;
      font-weight: bold;
      margin-right: 8px;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 32px;
    }
    
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    
    .btn-primary:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }
    
    .btn-secondary {
      background: #757575;
      color: white;
      font-size: 14px;
      padding: 12px 24px;
    }
    
    .btn-secondary:hover {
      background: #616161;
    }
    
    .btn-warning {
      background: #F44336;
      color: white;
      font-size: 12px;
      padding: 10px 20px;
    }
    
    .btn-warning:hover {
      background: #D32F2F;
    }
  </style>
</head>
<body>
  <div class="warning-container">
    <div class="warning-icon">⚠️</div>
    <h1 class="warning-title">危险网站警告</h1>
    
    <div class="warning-content">
      <h3>您即将访问的网站可能包含威胁：</h3>
      <div class="url-display" id="urlDisplay"></div>
      <div class="threat-type" id="threatType">网络钓鱼网站</div>
      <p id="threatDescription">
        该网站可能尝试窃取您的个人信息或财务数据。
      </p>
    </div>
    
    <div class="recommendations">
      <h4>⚠️ 建议操作：</h4>
      <ul>
        <li>不要输入任何个人信息</li>
        <li>不要下载任何文件</li>
        <li>立即关闭此页面</li>
        <li>如果已输入信息，请尽快更改密码</li>
      </ul>
    </div>
    
    <div class="button-group">
      <button class="btn btn-primary" id="backBtn">返回安全</button>
      <button class="btn btn-secondary btn-warning" id="continueBtn">仍然继续（不推荐）</button>
    </div>
  </div>
  
  <script src ="malicious-url.js"></script>
</body>
</html>
