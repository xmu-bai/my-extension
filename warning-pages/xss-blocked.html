<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSS攻击已阻止</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .notification-container {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
      text-align: center;
    }
    
    .notification-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    .notification-title {
      font-size: 24px;
      font-weight: 600;
      color: #4CAF50;
      margin-bottom: 20px;
    }
    
    .info-box {
      background: #e8f5e9;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      padding: 20px;
      margin: 24px 0;
      text-align: left;
    }
    
    .info-item {
      margin-bottom: 12px;
      font-size: 14px;
      color: #333;
    }
    
    .info-item:last-child {
      margin-bottom: 0;
    }
    
    .info-label {
      font-weight: 600;
      color: #2e7d32;
      margin-right: 8px;
    }
    
    .details-section {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
    }
    
    .details-section h4 {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }
    
    .details-section p {
      font-size: 13px;
      color: #999;
      line-height: 1.5;
    }
    
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #2196F3;
      color: white;
    }
    
    .btn-primary:hover {
      background: #1976D2;
    }
    
    .btn-secondary {
      background: #757575;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #616161;
    }
    
    .btn-success {
      background: #4CAF50;
      color: white;
      flex: 1;
    }
    
    .btn-success:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="notification-container">
    <div class="notification-icon">🛡️</div>
    <h1 class="notification-title">XSS攻击已阻止</h1>
    
    <div class="info-box">
      <div class="info-item">
        <span class="info-label">已阻止潜在XSS攻击</span>
      </div>
      <div class="info-item">
        <span class="info-label">攻击类型：</span>
        <span id="attackType">可疑的DOM操作</span>
      </div>
      <div class="info-item">
        <span class="info-label">阻止位置：</span>
        <span id="blockLocation"></span>
      </div>
      <div class="info-item">
        <span class="info-label">时间：</span>
        <span id="blockTime"></span>
      </div>
    </div>
    
    <div class="details-section">
      <h4>详细信息：</h4>
      <p id="detailsText">检测到可疑的innerHTML操作，已自动阻止执行。</p>
    </div>
    
    <div class="button-group">
      <button class="btn btn-primary" id="viewDetailsBtn">查看详情</button>
      <button class="btn btn-secondary" id="reportBtn">报告误报</button>
    </div>
    
    <div style="margin-top: 20px;">
      <button class="btn btn-success" id="okBtn">我知道了</button>
    </div>
  </div>
  
  <script>
    // 从URL参数获取信息
    const urlParams = new URLSearchParams(window.location.search);
    const attackType = urlParams.get('type') || '可疑的DOM操作';
    const location = urlParams.get('location') || window.location.href;
    const timestamp = urlParams.get('timestamp') || Date.now();
    
    // 显示信息
    document.getElementById('attackType').textContent = attackType;
    document.getElementById('blockLocation').textContent = location;
    
    const date = new Date(parseInt(timestamp));
    document.getElementById('blockTime').textContent = date.toLocaleString('zh-CN');
    
    // 按钮事件
    document.getElementById('okBtn').addEventListener('click', () => {
      window.close();
    });
    
    document.getElementById('viewDetailsBtn').addEventListener('click', () => {
      alert('详细信息：\n\n攻击类型: ' + attackType + '\n位置: ' + location + '\n时间: ' + date.toLocaleString('zh-CN'));
    });
    
    document.getElementById('reportBtn').addEventListener('click', () => {
      if (confirm('您认为这是一个误报吗？\n\n如果确认，我们将记录此信息以改进检测算法。')) {
        alert('感谢您的反馈！');
      }
    });
  </script>
</body>
</html>
