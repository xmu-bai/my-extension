<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h2>🔒 安全助手设置</h2>
  
  <!-- 新增提示容器（用于显示各类提示信息） -->
  <div id="messageContainer"></div>
  
  <div class="setting-item">
    <label>
      <input type="checkbox" id="autoScan">
      启用自动扫描
    </label>
    <div class="description">自动扫描每个页面的安全风险</div>
  </div>

  <div class="setting-item">
    <label>
      <input type="checkbox" id="notifications">
      显示桌面通知
    </label>
    <div class="description">发现安全问题时显示桌面通知</div>
  </div>

  <!-- 仅修改select选项值为大写 -->
<div class="setting-item">
  <label>扫描敏感度：</label>
  <select id="sensitivity">
    <option value="LOW">低</option>
    <option value="MEDIUM" selected>中</option>
    <option value="HIGH">高</option>
  </select>
</div>

  <div class="setting-item">
    <label>忽略的网站：</label>
    <textarea id="ignoredSites" rows="4" placeholder="每行输入一个要忽略的网站域名，例如：example.com&#10;localhost&#10;127.0.0.1&#10;# 此行是注释（不会被保存）"></textarea>
    <div class="description">这些网站将不会进行安全扫描（以#开头的行为注释，不会被保存）</div>
  </div>

  <button id="saveBtn">保存设置</button>
  <button id="resetBtn">恢复默认</button>

  <script src="options.js"></script>
</body>
</html>
