<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全浏览器插件 - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🔒 安全浏览器插件 - 设置</h1>
    </header>

    <main class="main-content">
      <!-- 功能设置 -->
      <section class="section">
        <h2 class="section-title">功能设置</h2>

        <!-- URL检测设置 -->
        <div class="card">
          <div class="card-header">
            <span class="card-icon">🔗</span>
            <h3>恶意URL检测</h3>
          </div>
          <div class="card-content">
            <div class="setting-item">
              <label class="setting-label">启用URL检测</label>
              <label class="switch">
                <input type="checkbox" id="urlDetectionEnabled" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="setting-item">
              <label class="setting-label">数据源选择：</label>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="dataSource" value="local" checked>
                  <span>本地缓存数据库</span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="dataSource" value="google">
                  <span>Google Safe Browsing API</span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="dataSource" value="thirdParty">
                  <span>第三方威胁情报源</span>
                </label>
              </div>
            </div>
            <div class="setting-item">
              <label class="setting-label">检测频率:</label>
              <select id="checkFrequency" class="select">
                <option value="realtime">实时检测</option>
                <option value="onLoad">页面加载时</option>
              </select>
            </div>

            <hr style="border:none;border-top:1px solid #eee;margin:12px 0;" />
            <div class="setting-item">
              <label class="setting-label">URL覆盖采集</label>
              <div class="checkbox-group">
                <label class="checkbox-label">
                  <input type="checkbox" id="scanElements" checked>
                  <span>扫描页面元素链接（a/img/script/link/iframe/form 等）</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="scanFetch" checked>
                  <span>拦截 fetch 请求</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="scanXHR" checked>
                  <span>拦截 XHR 请求</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="scanWebSocket" checked>
                  <span>拦截 WebSocket 连接</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="scanWindowOpen" checked>
                  <span>拦截 window.open 跳转</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="scanMetaRefresh" checked>
                  <span>检测 meta refresh 跳转</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="scanCssUrls">
                  <span>解析 CSS url(...)（可能影响性能）</span>
                </label>
              </div>
            </div>
            <div class="setting-item">
              <label class="setting-label">URL 去重 TTL（毫秒）</label>
              <input type="number" id="dedupeTtlMs" class="select" min="1000" step="1000" value="120000" style="max-width: 180px;">
            </div>
          </div>
        </div>

        <!-- XSS防护设置 -->
        <div class="card">
          <div class="card-header">
            <span class="card-icon">🛡️</span>
            <h3>XSS防护</h3>
          </div>
          <div class="card-content">
            <div class="setting-item">
              <label class="setting-label">启用XSS防护</label>
              <label class="switch">
                <input type="checkbox" id="xssProtectionEnabled" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="setting-item">
              <label class="setting-label">防护级别:</label>
              <select id="xssLevel" class="select">
                <option value="standard">标准防护（推荐）</option>
                <option value="strict">严格防护</option>
                <option value="custom">自定义规则</option>
              </select>
            </div>
            <div class="setting-item">
              <label class="setting-label">自动阻止可疑操作</label>
              <label class="switch">
                <input type="checkbox" id="xssAutoBlock" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="setting-item">
              <label class="setting-label">显示确认对话框</label>
              <label class="switch">
                <input type="checkbox" id="xssShowConfirm">
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>

        <!-- 追踪阻止设置 -->
        <div class="card">
          <div class="card-header">
            <span class="card-icon">🚫</span>
            <h3>隐私追踪阻止</h3>
          </div>
          <div class="card-content">
            <div class="setting-item">
              <label class="setting-label">启用追踪阻止</label>
              <label class="switch">
                <input type="checkbox" id="trackerBlockingEnabled" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="setting-item">
              <label class="setting-label">阻止类型：</label>
              <div class="checkbox-group">
                <label class="checkbox-label">
                  <input type="checkbox" id="blockAds" checked>
                  <span>广告追踪器</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="blockSocial" checked>
                  <span>社交媒体追踪器</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="blockDataCollection" checked>
                  <span>数据收集脚本</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="blockFingerprinting" checked>
                  <span>指纹识别脚本</span>
                </label>
              </div>
            </div>
            <div class="setting-item">
              <label class="setting-label">第三方Cookie</label>
              <label class="switch">
                <input type="checkbox" id="thirdPartyCookies" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="setting-item">
              <label class="setting-label">Canvas指纹防护</label>
              <label class="switch">
                <input type="checkbox" id="canvasProtection" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="setting-item">
              <label class="setting-label">WebRTC防护</label>
              <label class="switch">
                <input type="checkbox" id="webrtcProtection" checked>
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- 白名单管理 -->
      <section class="section">
        <h2 class="section-title">白名单管理</h2>
        <div class="card">
          <div class="card-content">
            <div class="whitelist-header">
              <label class="setting-label">允许的网站</label>
              <button class="btn btn-primary" id="addWhitelistBtn">+ 添加网站</button>
            </div>
            <div class="whitelist-list" id="whitelistList">
              <!-- 白名单项将通过JS动态添加 -->
            </div>
          </div>
        </div>
      </section>

      <!-- 历史记录 -->
      <section class="section">
        <h2 class="section-title">历史记录</h2>
        <div class="card">
          <div class="card-content">
            <div class="history-list" id="historyList">
              <!-- 历史记录项将通过JS动态添加 -->
            </div>
            <button class="btn btn-secondary" id="loadMoreHistory">查看更多记录...</button>
          </div>
        </div>
      </section>

      <!-- 数据统计 -->
      <section class="section">
        <h2 class="section-title">数据统计</h2>
        <div class="card">
          <div class="card-content">
            <div class="stats-grid">
              <div class="stat-card">
                <span class="stat-icon">🛡️</span>
                <div class="stat-content">
                  <div class="stat-value" id="threatsBlocked">0</div>
                  <div class="stat-label">已阻止威胁</div>
                </div>
              </div>
              <div class="stat-card">
                <span class="stat-icon">🚫</span>
                <div class="stat-content">
                  <div class="stat-value" id="trackersBlocked">0</div>
                  <div class="stat-label">已阻止追踪器</div>
                </div>
              </div>
              <div class="stat-card">
                <span class="stat-icon">⚠️</span>
                <div class="stat-content">
                  <div class="stat-value" id="xssIntercepted">0</div>
                  <div class="stat-label">XSS拦截</div>
                </div>
              </div>
            </div>
            <button class="btn btn-primary" id="generateReportBtn">生成详细报告</button>
          </div>
        </div>
      </section>

      <!-- 威胁数据库（在线源/刷新/导入导出） -->
      <section class="section">
        <h2 class="section-title">威胁数据库</h2>
        <div class="card">
          <div class="card-header">
            <span class="card-icon">📚</span>
            <h3>在线源与刷新</h3>
          </div>
          <div class="card-content">
            <div class="setting-item">
              <label class="setting-label">在线源（每行一个URL，支持JSON或纯文本列表）</label>
              <textarea id="dbSources" rows="5" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace;" placeholder="例如：\nhttps://example.com/malicious.json\nhttps://example.org/blocklist.txt" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
            </div>
            <div class="setting-item">
              <label class="setting-label">自动刷新间隔（小时，最小0.5小时）</label>
              <input type="number" id="refreshIntervalHours" class="select" min="0.5" step="0.5" value="24" style="max-width: 140px;">
            </div>
            <div class="setting-item" style="display:flex; gap:12px; flex-wrap: wrap; align-items: center;">
              <button class="btn btn-primary" id="refreshDbBtn">立即刷新</button>
              <button class="btn btn-secondary" id="importDbBtn">导入</button>
              <input type="file" id="importDbFile" accept=".json,.txt" style="display:none;" />
              <button class="btn" id="exportDbBtn" style="background:#4CAF50;color:#fff;">导出</button>
              <div id="dbStatus" style="color:#666; font-size:12px;">
                <span>域名：<strong id="dbDomainsCount">0</strong></span>
                <span style="margin:0 8px;">|</span>
                <span>正则：<strong id="dbPatternsCount">0</strong></span>
                <span style="margin:0 8px;">|</span>
                <span>上次更新：<strong id="dbUpdatedAt">-</strong></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 隐私设置 -->
      <section class="section">
        <h2 class="section-title">隐私设置</h2>
        <div class="card">
          <div class="card-content">
            <div class="setting-item">
              <label class="checkbox-label">
                <input type="checkbox" id="anonymousReport" checked>
                <span>匿名化威胁报告（推荐）</span>
              </label>
            </div>
            <div class="setting-item">
              <label class="checkbox-label">
                <input type="checkbox" id="autoUpdate" checked>
                <span>自动更新威胁数据库</span>
              </label>
            </div>
            <div class="action-buttons">
              <button class="btn btn-danger" id="clearDataBtn">清除所有数据</button>
              <button class="btn btn-secondary" id="resetBtn">重置为默认设置</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 保存按钮 -->
      <div class="save-section">
        <button class="btn btn-primary btn-large" id="saveBtn">保存设置</button>
      </div>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
